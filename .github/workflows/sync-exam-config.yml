name: Sync exam config from scraper

on:
  workflow_dispatch:
    inputs:
      scraper_run_id:
        description: GitHub Actions run ID from MatricPulseScrapper
        required: true
        type: string
      artifact_name:
        description: Artifact to copy into public/ (past-papers-config or timetable-config)
        required: false
        default: past-papers-config
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download scraper artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: public
          repository: TheAkatsukii/MatricPulseScrapper
          run-id: ${{ inputs.scraper_run_id }}
          github-token: ${{ secrets.CONFIG_SYNC_TOKEN }}

      - name: Commit public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.artifact_name }}" = "timetable-config" ]; then
            FILE=public/timetable.json
            MSG="chore: refresh timetable"
          else
            FILE=public/past_papers_archive.json
            MSG="chore: refresh past papers archive"
          fi
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No changes in $FILE"
          else
            git commit -m "$MSG"
            git push
          fi
