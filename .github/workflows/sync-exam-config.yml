name: Sync exam config from scraper

on:
  workflow_dispatch:
    inputs:
      scraper_run_id:
        description: GitHub Actions run ID from MatricPulseScrapper that uploaded past-papers-config
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download scraper artifact
        uses: actions/download-artifact@v4
        with:
          name: past-papers-config
          path: public
          repository: TheAkatsukii/MatricPulseScrapper
          run-id: ${{ inputs.scraper_run_id }}
          github-token: ${{ secrets.CONFIG_SYNC_TOKEN }}

      - name: Commit public past papers JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/past_papers_archive.json
          if git diff --staged --quiet; then
            echo "No past-papers changes."
          else
            git commit -m "chore: refresh past papers archive"
            git push
          fi
